# Ролик 2 · Початок зміни — єдине джерело (README.md): змінні, кроки, озвучка, дії Maestro.
# Інший герой чи авто — змінити vars; змінився текст кнопки — змінити лише відповідний крок.
id: "02"
title: Початок зміни
caption: Прийняли авто — і на лінію
appId: ua.com.g24
wordsPerSecond: 1.9      # темп диктора (Леся ≈ 1,9 слова/с з паузами) — для пауз і перевірки "встигає"
tailSeconds: 0.7         # запас після кожної репліки

vars:
  hero: Петренко Олександр
  park: Київ
  model: Toyota Camry
  plate: KA 9001 AR
  mileageReal: 20 146      # реальний пробіг на одометрі в ролику (вводиться при прийнятті)
  mileageTypeDigits: "146" # які дописати

prep:
  - "Герой ({hero}, парк «{park}») увійшов, без авто; {model} {plate} вільна і стоїть у нього в графіку на сьогодні."
  - Емулятор — demo mode статус-бару (12:00), «Не турбувати», світла тема (робить tools/record.sh).

# До мітки START (у ролик не потрапляє): застосунок на Головній.
setup:
  - launchApp
  - extendedWaitUntil:
      visible: Ви не у автомобілі
      timeout: 30000

steps:
  - id: s1
    screen: Головна — «Мій автомобіль · Ви не у автомобілі», авто за графіком
    say: Початок зміни. На головній видно, що авто ще не прийняте, і яке воно у вас за графіком.

  - id: s2
    screen: «Обрати автомобіль» → вкладка «Вільні», {model} першою з позначкою «За графіком»
    say: Натисніть «Обрати автомобіль». Ваша машина за графіком — першою, з синьою позначкою.
    do:
      - tapOn: Обрати автомобіль
      - extendedWaitUntil:
          visible: За графіком
          timeout: 10000

  - id: s3
    screen: «Прийняти» на картці {model} → вікно «Прийняти автомобіль», пробіг підставлено останній відомий
    say: Натисніть «Прийняти» на її картці. Застосунок підставить останній відомий пробіг.
    do:
      - tapOn:
          text: Прийняти
          index: 0
      - extendedWaitUntil:
          visible: Прийняти автомобіль
          timeout: 10000

  - id: s4
    screen: Курсор у кінці — стерто останні цифри, введено реальний пробіг {mileageReal} км
    say: Обов'язково звірте його з одометром і виправте на реальний — тут {mileageReal} кілометрів.
    do:
      - eraseText: 3               # стільки останніх цифр стерти (див. mileageTypeDigits)
      - inputText: "{mileageTypeDigits}"

  - id: s5
    screen: «Прийняти» → сторінка авто, «Загальне», внизу «Автомобіль прийнято · Скасувати»
    say: Натисніть «Прийняти». Готово — авто ваше. Помилились машиною — одразу натисніть «Скасувати».
    do:
      - tapOn: Прийняти          # у вікні — єдина кнопка з таким текстом (заголовок — «Прийняти автомобіль»)
      - extendedWaitUntil:
          visible: Автомобіль прийнято
          timeout: 10000

  - id: s6
    screen: «Головна» → велика картка {model} і «Здати автомобіль»
    say: На головній тепер ваше авто. Наприкінці зміни здасте його тут же.
    do:
      - tapOn: Головна
